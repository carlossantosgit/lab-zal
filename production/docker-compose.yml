services:
  prometheus-zabbix-sync:
    build: .
    image: prometheus-zabbix-sync:latest
    container_name: prometheus-zabbix-sync
    restart: unless-stopped

    environment:
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      PUSH_INTERVAL_MINUTES: ${PUSH_INTERVAL_MINUTES:-1}

    # Logs visíveis via: docker compose logs -f
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
